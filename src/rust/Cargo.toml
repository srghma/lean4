[workspace]
members = [
  "leanh",
  "runtime",
  "gen_init_ffi",
  "gen_init",
  "gen_std_ffi",
  "gen_std",
  "gen_lean_ffi",
  "gen_lean",
  "lake_ffi",
  "lake",
  "lean_checker",
  # "lean_ir",
  # "lean_shell",
  # "leanc",
]
resolver = "2"

[profile.dev]
panic = "abort"
codegen-units = 1
lto = false

[profile.release]
panic = "abort"
debug = true
codegen-units = 1
lto = false
