[package]
name = "lean_runtime"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = []
export-runtime-ffi = []
small_allocator = []
default-max-heartbeat = []
default-max-memory = []
use_gmp = []
lsan = []

[dependencies]
libc = "0.2"

[lib]
crate-type = ["rlib", "staticlib"]
