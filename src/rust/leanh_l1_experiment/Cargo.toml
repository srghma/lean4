[package]
name = "leanh_l1_experiment"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pure-Rust arbitrary-precision integers — replaces gmp-mpfr-sys / mpz_t
num-bigint = "0.5"
num-traits = "0.2"

# Typed atomic wrapper for enum fields — replaces AtomicI32 with magic 0/1
atomic_enum = "0.3"

# Async runtime — Mutex/OnceCell/JoinHandle replacing std::sync equivalents
# "sync" gives the async-aware primitives; "rt" gives JoinHandle
tokio = { version = "1", features = ["sync", "rt"] }

[lints.clippy]
missing_safety_doc = "allow"
